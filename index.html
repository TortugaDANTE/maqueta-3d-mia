<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta 3D · MIA Global Consulting</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#fff;color:#1A1A1A}
header{border-bottom:4px solid #F7934C;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0;color:#C4570C;flex:1}
button{border:2px solid #F7934C;background:#fff;color:#C4570C;border-radius:6px;padding:7px 12px;font-size:14px;cursor:pointer}
button.on{background:#F7934C;color:#fff}
main{padding:12px;max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{border:1px solid #F7934C;border-radius:8px;overflow:hidden;cursor:pointer}
.card img{width:100%;height:160px;object-fit:cover;background:#FDEEE2;display:block}
.card div{padding:8px;font-weight:600}
.hero{width:100%;border-radius:8px;margin-bottom:12px}
model-viewer{width:100%;height:60vh;background:#FDEEE2;border-radius:8px}
.lam{width:100%;border-radius:8px}
.tabs{display:flex;gap:8px;margin:10px 0}</style></head><body>
<header><h1 id="tit">Maqueta 3D</h1><button id="b1" onclick="loc('1')">Locación 1</button><button id="b2" onclick="loc('2')">Locación 2</button><button onclick="atras()">◀ Regresar</button></header>
<main id="m"></main>
<script>const P={"1": [["poi04_casa_pedro", "Casa de Pedro"], ["poi05_familia_kikiri", "Gallinero Kikiri"], ["poi06_tortugario", "Tortugario"], ["poi07_invernadero_nave1", "Nave 1"], ["poi08_invernadero_nave2", "Nave 2"], ["poi10_vivero3", "Vivero 3"]], "2": [["poi01_gallinero1", "Gallinero 1"], ["poi02_gallinero2", "Gallinero 2"], ["poi03_semillero", "Semillero"], ["poi09_pileta_piscicultura", "Pileta"]]};
const m=document.getElementById('m');let hist=[],cur=null;
function go(s,push=true){if(push&&cur)hist.push(cur);cur=s;render();}
function atras(){if(hist.length){cur=hist.pop();render();}}
function loc(n){go({v:'loc',n});}
function tab(t){cur=Object.assign({},cur,{t});render();}
function render(){const s=cur;b1.classList.toggle('on',s.n=='1');b2.classList.toggle('on',s.n=='2');
 if(s.v=='inicio'){tit.textContent='Maqueta 3D';m.innerHTML='<div class="grid">'+['1','2'].map(n=>`<div class="card" onclick="loc('${n}')"><img src="img/loc${n}.jpg"><div>Locación ${n} · ${P[n].length} lugares</div></div>`).join('')+'</div>';}
 else if(s.v=='loc'){tit.textContent='Locación '+s.n;m.innerHTML=`<img class="hero" src="img/loc${s.n}.jpg"><div class="grid">`+P[s.n].map(([id,nom])=>`<div class="card" onclick="go({v:'lugar',n:'${s.n}',id:'${id}',nom:'${nom}'})"><img src="img/${id}_iso_preview.jpg"><div>${nom}</div></div>`).join('')+'</div>';}
 else{tit.textContent=s.nom;const t=s.t||'3d';m.innerHTML=`<div class="tabs"><button class="${t=='3d'?'on':''}" onclick="tab('3d')">Modelo 3D</button><button class="${t=='il'?'on':''}" onclick="tab('il')">Ilustración</button></div>`+(t=='3d'?`<model-viewer src="mod/${s.id}_preview.glb" camera-controls auto-rotate shadow-intensity="0.6" touch-action="pan-y" alt="${s.nom}"></model-viewer>`:`<img class="lam" src="img/${s.id}_iso_preview.jpg">`);}}
go({v:'inicio'},false);</script></body></html>
