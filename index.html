<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maqueta 3D · MIA Global Consulting</title>
<script type="module">
import {ModelViewerElement} from "https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
ModelViewerElement.meshoptDecoderLocation="https://cdn.jsdelivr.net/npm/meshoptimizer@0.21.0/meshopt_decoder.js";
</script>
<style>
html,body{margin:0;height:100%;font-family:system-ui,Arial,sans-serif;background:#fff;color:#1A1A1A}
header{background:#fff;border-bottom:4px solid #F7934C;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0;color:#C4570C}
header span{font-size:13px}
model-viewer{width:100%;height:calc(100% - 96px);background:#FDEEE2;--poster-color:#FDEEE2}
footer{height:38px;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;border-top:1px solid #F7934C}
</style></head><body>
<header><h1>Maqueta 3D del predio</h1><span>MIA Global Consulting</span></header>
<model-viewer src="maqueta.glb" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="0.6" exposure="1.1" camera-orbit="30deg 55deg auto" alt="Maqueta 3D ilustrativa"></model-viewer>
<footer>Gira con el dedo o el ratón · Pellizca o usa la rueda para acercar · Maqueta ilustrativa, ubicaciones generales</footer>
</body></html>
